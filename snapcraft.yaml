---
name: kxstitch
confinement: strict
grade: stable
base: core24
adopt-info: kxstitch
apps:
    kxstitch:
        extensions:
        - kde-neon-6
        common-id: org.kde.kxstitch.desktop
        desktop: usr/share/applications/org.kde.kxstitch.desktop
        command: usr/bin/kxstitch
        plugs:
        - home
        - cups
        - audio-playback
        - network
        environment:
            MAGICK_CONFIGURE_PATH: "$SNAP/etc/ImageMagick-6:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ImageMagick-6.9.12/config-Q16:$SNAP/usr/share/ImageMagick-6"
            MAGICK_CODER_MODULE_PATH: "$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ImageMagick-6.9.12/modules-Q16/coders"
            MAGICK_CODER_FILTER_PATH: "$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ImageMagick-6.9.12/modules-Q16/filters"
slots:
    session-dbus-interface:
        interface: dbus
        name: org.kde.kxstitch
        bus: session
parts:
    kxstitch:
        parse-info:
        - usr/share/metainfo/org.kde.kxstitch.appdata.xml
        plugin: cmake
        source: .
        source-type: local
        build-snaps:
        - kde-qt6-core24-sdk/latest/beta
        - kf6-core24-sdk/latest/beta
        build-packages:
        - pkgconf
        - libmagick++-6.q16-dev
        - libxkbcommon-dev
        stage-packages:
        - libmagick++-6.q16-9t64
        cmake-parameters:
        - "-DCMAKE_INSTALL_PREFIX=/usr"
        - "-DCMAKE_BUILD_TYPE=Release"
        - "-DBUILD_TESTING=OFF"
        prime:
        - "-usr/lib/*/cmake/*"
        - "-usr/include/*"
        - "-usr/share/ECM/*"
        - "-usr/share/man/*"
        - "-usr/bin/X11"
        - "-usr/lib/gcc/$CRAFT_ARCH_TRIPLET_BUILD_FOR/6.0.0"
        - "-usr/lib/aspell/*"
        - "-usr/share/lintian"
    gpu-2404:
        after:
        - kxstitch
        source: https://github.com/canonical/gpu-snap.git
        plugin: dump
        override-prime: |
            craftctl default
            ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
        prime:
        - bin/gpu-2404-wrapper
    cleanup:
        after:
        - kxstitch
        plugin: nil
        build-snaps:
        - core24
        - kf6-core24
        override-prime: |
            set -eux
            for snap in "core24" "kf6-core24"; do
                cd "/snap/$snap/current" && find . -type f,l -exec rm -rf "${CRAFT_PRIME}/{}" \;
            done
